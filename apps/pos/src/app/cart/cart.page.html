<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Cart</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-no-padding">
  <ion-grid class="pos-grid ion-no-padding">
    <ion-row class="pos-row">

      <!-- Left Area (Products/Catalog) -->
      <ion-col size="8" class="pos-col-left">
        <div class="wire-box top-left-box">
          <!-- Main Content Area -->
        </div>
        <div class="wire-box bottom-left-box">
          <!-- Secondary Content Area -->
        </div>
      </ion-col>

      <!-- Right Area (Cart/Checkout) -->
      <ion-col size="4" class="pos-col-right">
        <div class="wire-box top-right-box">
          <!-- Customer/Order Info -->
        </div>
        <div class="wire-box middle-right-box">
          <!-- Cart Items -->
        </div>
      </ion-col>

    </ion-row>
  </ion-grid>
</ion-content>
<ion-footer class="ion-no-border pos-footer">
  <ion-toolbar>
    <ion-grid>
      <ion-row class="ion-align-items-center">
        <ion-col size="6" class="ion-text-center">
          <h2 class="weight-display">1000 KG</h2>
        </ion-col>
        <ion-col size="6">
          <ion-button expand="block" color="primary" class="footer-pay-button">
            PAY
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
