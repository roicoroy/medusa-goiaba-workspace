<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/cart"></ion-back-button>
    </ion-buttons>
    <ion-title>Checkout</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid *ngIf="viewState$ | async as viewState">
    <ion-row>
      <!-- Order Summary -->
      <ion-col size="6">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Order Summary</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-list>
              <ion-item *ngFor="let item of viewState.cart?.items">
                <ion-label>
                  <h2>{{ item.title }}</h2>
                  <p>Qty: {{ item.quantity }}</p>
                </ion-label>
                <div slot="end">
                  {{ (item.total || 0) | currency:viewState.cart?.currency_code }}
                </div>
              </ion-item>
            </ion-list>
            
            <div style="margin-top: 16px; font-size: 1.2rem; font-weight: bold; text-align: right;">
              Total: {{ (viewState.cart?.total || 0) | currency:viewState.cart?.currency_code }}
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <!-- Payment Methods -->
      <ion-col size="6">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Select Payment Method</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-list>
              <ion-item button (click)="selectMethod('manual')" [color]="selectedPaymentMethod === 'manual' ? 'light' : ''">
                <ion-label>Cash (Manual Provider)</ion-label>
              </ion-item>
              <ion-item button (click)="selectMethod('stripe')" [color]="selectedPaymentMethod === 'stripe' ? 'light' : ''">
                <ion-label>Card Terminal (Stripe)</ion-label>
              </ion-item>
            </ion-list>

            <ion-button expand="block" size="large" color="success" style="margin-top: 32px;" (click)="completeOrder()">
              Complete Order
            </ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
